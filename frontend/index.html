<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lodijke Master Platform — Zeeuws Visserij Dossier & Archiefbeheer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
        background-color: #f8f9fa;
        color: #1e293b;
        scroll-behavior: smooth;
      }
      /* Fix voor Leaflet tegels zodat ze nooit grijs of verschoven blijven */
      .leaflet-container {
        width: 100%;
        height: 100%;
        background: #0f172a !important;
        font-family: inherit;
      }
      .custom-red-popup .leaflet-popup-content-wrapper {
        background: rgba(139, 26, 26, 0.96);
        color: #ffffff;
        border: 1px solid #f87171;
        border-radius: 6px;
        text-align: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      }
      .custom-red-popup .leaflet-popup-tip {
        background: rgba(139, 26, 26, 0.96);
      }
      .custom-red-popup .leaflet-popup-content {
        margin: 10px 14px;
        font-size: 12.5px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
